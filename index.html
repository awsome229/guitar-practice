.song{border:1px solid var(--bd);border-radius:10px;background:var(--card);margin:10px 0;padding:0}
.song>summary{padding:14px;font:600 19px var(--f);list-style:none;display:flex;justify-content:space-between;align-items:center}
.song>summary::-webkit-details-marker{display:none}
.song>summary::after{content:"+";color:var(--ac);font-size:24px}
.song[open]>summary::after{content:"−"}
.song .card{border:0;margin:0;padding:0 14px 14px}
.an{max-width:170px;margin:6px auto;text-align:center}
.an svg{width:100%;height:auto;display:block}
.hh{transform-origin:50px 100px}
.hh.sh{animation:hsh .25s linear infinite}
.hh.rl{animation:hrl 1s ease-in-out infinite}
.hh.st{animation:hst 1s ease-in-out infinite}
.hh.fs .fg{transform-origin:50px 57px;animation:hfs 1s ease-in-out infinite}
@keyframes hsh{0%{transform:translateX(-4px)}50%{transform:translateX(4px)}100%{transform:translateX(-4px)}}
@keyframes hrl{0%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}100%{transform:rotate(-18deg)}}
@keyframes hst{0%{transform:rotate(0)}50%{transform:rotate(-32deg)}100%{transform:rotate(0)}}
@keyframes hfs{0%{transform:scaleY(1)}50%{transform:scaleY(.35)}100%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.hh,.hh .fg{animation:none!important}}


button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:2px}

.chk:last-child{border:0}
.chk input{width:24px;height:24px;margin-top:2px;accent-color:var(--ac);flex:none}
.chk b{display:block}
.chk input:checked+div{opacity:.5;text-decoration:line-through}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.ch{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 8px 8px;text-align:center}
.ch b{font:600 20px var(--f)}
.ch svg{width:100%;height:auto;display:block}
.seg{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.seg button,.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:10px 14px;font:600 15px var(--f);cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--onp);border-color:var(--pri)}
.btn.go{background:var(--pri);color:var(--onp);border-color:var(--pri)}
.row{display:flex;align-items:center;gap:12px}
.bpm{font:600 40px var(--f);min-width:80px}
input[type=range]{flex:1;accent-color:var(--ac)}
.pat{font:600 22px var(--f);letter-spacing:.04em}
a{color:var(--ac);font-weight:600}
details{border-bottom:1px solid var(--bd);padding:8px 0}
summary{cursor:pointer;font-weight:600}
.st{font:600 36px var(--f);color:var(--ac)}
.stats{display:flex;gap:24px}
.pt{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;text-align:center;margin:8px 0}
.pt .c{font-size:12px;color:var(--mu)}
.pt .a{font:600 24px var(--f);border:1px solid var(--bd);border-radius:6px;padding:2px 0;background:var(--bg)}
.pt .a.on{color:var(--ac);border-color:var(--ac)}
.pt .a.off{color:var(--mu);opacity:.45}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 12px}
.bar{border:1px solid var(--bd);border-radius:6px;padding:8px 2px;text-align:center;background:var(--bg)}
.bar b{font:600 22px var(--f);color:var(--ac);display:block}
.bar span{font-size:11px;color:var(--mu);display:block}
</style>
</head>

h+=`<h2>How to practice it</h2><div class='card'><p><b>1. Mute it.</b> Rest your fretting hand lightly across all the strings so they sound like a dull chk. Practice the pattern with no chord to get the rhythm.</p><p><b>2. Add one chord.</b> Pick an easy one like Em and play the pattern with the metronome at 60 BPM. Repeat until it feels boring.</p><p><b>3. Keep going through changes.</b> Switch chords on beat 1 of the bar and keep your hand swinging even if the chord isn’t ready. A messy chord in time beats a perfect chord late.</p><p><b>4. Speed up slowly.</b> After four clean bars in a row, add 5 BPM. If you stumble, drop back 10.</p><p><b>5. Say it out loud</b> (“down, down-up, up-down-up”) while you play. It locks the rhythm in your head.</p></div>`;

spider:{n:24,f:function(i){var st=Math.floor(i/4),fi=i%4+1,d=[],k;for(k=1;k<=fi;k++)d.push([st,k,k]);return{svg:afb(d,fi-1,st),cap:`${NAMES[st]} string: finger ${fi} on fret ${fi}`}}},
press:{n:12,f:function(i){var fi=Math.floor(i/3)+1,ph=i%3;return{svg:afb(ph<2?[[2,fi,fi]]:[],ph<2?0:-1,2),cap:ph===0?`Press finger ${fi} on fret ${fi}`:ph===1?`Hold it for a moment`:`Release`}}},
chord:{n:5,f:function(i){var d=[],k,f;if(i<3){for(k=0;k<6;k++){f=CH.Em.f[k];d.push(f>0?[k,f,CH.Em.n[k]]:[k,f<0?-1:0,0])}}return{svg:afb(d,-1,-1),cap:[`Form the shape (Em shown)`,`Hold it and pick each string to check for buzz`,`Still holding`,`Lift all fingers off`,`Relax, then form it again`][i]}}},
pick:{n:10,f:function(i){var o=[0,1,2,3,4,5,4,3,2,1],st=o[i],d=[],k;for(k=0;k<6;k++)d.push([k,0,0]);return{svg:afb(d,-1,st),cap:`Pick the ${NAMES[st]} string ${i%2?`up ↑`:`down ↓`}`}}},
hand:{n:18,f:function(i){var g=i<4?0:i<10?1:i<14?2:3;return{svg:handSVG([`sh`,`rl`,`st`,`fs`][g]),cap:[`Shake out both hands`,`Roll your wrists slowly`,`Gently press your palm back with the other hand`,`Open and close your fist`][g]}}}
};
function setBtn(id){var b=document.getElementById(`ab-`+id),st=ANIM[id];if(b)b.textContent=(st&&st.t)?`Pause`:`Play`}
function anStep(id){var st=ANIM[id],el=document.getElementById(`an-`+id),o;if(!el){anStop(id);return}o=ANS[id].f(st.i%ANS[id].n);el.innerHTML=o.svg+`<p class='mu'>${o.cap}</p>`;st.i++}
function anStart(id){var st=ANIM[id]||(ANIM[id]={i:0,t:null,paused:false});if(st.t)return;anStep(id);st.t=setInterval(function(){anStep(id)},1000);setBtn(id)}
function anStop(id){var st=ANIM[id];if(st&&st.t){clearInterval(st.t);st.t=null}setBtn(id)}
function anOpen(d){var id=d.getAttribute(`data-an`),st=ANIM[id]||(ANIM[id]={i:0,t:null,paused:false});st.i=0;if(!RM&&!st.paused)anStart(id);else{anStep(id);setBtn(id)}}
function anBox(id){return `<div class='an' id='an-${id}'></div><p style='text-align:center'><button class='btn' id='ab-${id}' data-ap='${id}'>Pause</button></p>`}
function warm_(){
var h=`<h1>Warm-ups</h1><p class='mu'>Two to five minutes before you play loosens your hands and cuts down on buzzing and sore fingers. Go slow and stay relaxed. Sore fingertips are normal. Pain in your joints or wrist is not, so stop if you feel it. Tap a warm-up to watch how it’s done.</p>`;
h+=`<div class='card'><p><b>Quick routine</b></p><p>2 min: spider walk</p><p>1 min: silent chord shapes</p><p>1 min: picking open strings</p><p>30 sec: one finger at a time</p></div>`;
h+=`<details class='song' data-an='spider' open><summary>Spider walk (2 min)</summary><div class='card'><p>The spider walk trains each finger to land on its own fret. Watch where each finger goes, then copy it on your guitar. The animation takes one step per second, which matches the metronome at 60 BPM.</p>${anBox('spider')}<p><b>1.</b> Put your index finger (1) on fret 1 of the thickest string, just behind the fret. Pick the note.</p><p><b>2.</b> Add your middle finger (2) on fret 2, ring (3) on fret 3, and pinky (4) on fret 4. Pick each note as you go.</p><p><b>3.</b> Move to the next string and repeat. Work across all six strings, then come back.</p><p><b>4.</b> Use the metronome at 60 BPM, one note per click, and make every note ring clearly.</p><p><b>Tips.</b> Keep your thumb behind the neck and your fingers arched. Keep fingertips close to the strings between notes instead of flying up. Press only as hard as you need. A weak pinky is normal and gets stronger.</p><p><b>Variations.</b> 1-3-2-4, 1-2-4-3, and 4-3-2-1 (pinky first). After a week or two, start the pattern at fret 2, then fret 3. Higher up the neck the frets are closer together, so the stretch is easier.</p></div></details>`;
h+=`<details class='song' data-an='press'><summary>One finger at a time (30 sec)</summary><div class='card'>${anBox('press')}<p>Press each finger on a fret, one at a time, and hold for 2 seconds before releasing. Pick the string to check it rings clean. This builds the habit of pressing just behind the fret with a light, even touch.</p></div></details>`;
h+=`<details class='song' data-an='chord'><summary>Silent chord shapes (1 min)</summary><div class='card'>${anBox('chord')}<p>Pick a chord from this week. Form the shape without strumming, then lift your fingers off completely and form it again. Do this 10 times, then pick each string to check for buzz. This is what makes chord changes faster, because your hand learns the shape as a whole.</p></div></details>`;
h+=`<details class='song' data-an='pick'><summary>Picking open strings (1 min)</summary><div class='card'>${anBox('pick')}<p>With no fretting hand at all, pick each open string with alternating down and up strokes, from the low E to the high e and back. Use the metronome at 60 BPM and keep your picking wrist loose. This warms up your picking hand and trains it to move evenly.</p></div></details>`;
h+=`<h2>Metronome</h2>`+met();
return h}
function fb(pts){var s=`<svg viewBox='0 0 100 126' role='img' aria-label='E minor pentatonic, open position'>`,x0=15,dx=14,top=32,fh=17,i;
for(i=0;i<6;i++)s+=`<line x1='${x0+i*dx}' y1='${top}' x2='${x0+i*dx}' y2='${top+5*fh}' stroke='var(--mu)' stroke-width='1'/>`;
for(i=0;i<=5;i++)s+=`<line x1='${x0}' y1='${top+i*fh}' x2='${x0+5*dx}' y2='${top+i*fh}' stroke='${i?'var(--mu)':'var(--tx)'}' stroke-width='${i?1:3.5}'/>`;
pts.forEach(function(p){var x=x0+(lefty?5-p[0]:p[0])*dx,y;if(p[1]===0)s+=`<circle cx='${x}' cy='19' r='4' fill='none' stroke='var(--ac)' stroke-width='2'/>`;else{y=top+(p[1]-.5)*fh;s+=`<circle cx='${x}' cy='${y}' r='6.5' fill='var(--ac)'/><text x='${x}' y='${y+4}' text-anchor='middle' font-size='10' font-weight='700' fill='var(--on)'>${p[2]}</text>`}});
return s+`<text x='50' y='122' text-anchor='middle' font-size='8' fill='var(--mu)'>${lefty?'e B G D A E':'E A D G B e'}</text></svg>`}
function scale_(){
var h=`<h1>Scale: E minor pentatonic</h1><p class='mu'>The most useful first scale. It has five notes, sits in the open position, and uses the same finger moves as the spider walk. Many rock and blues riffs and solos come from it. It starts in week 2, on Fridays and Saturdays.</p>`+hand();
h+=`<div class='card'><div style='max-width:160px;margin:0 auto'>${fb([[0,0],[0,3,3],[1,0],[1,2,2],[2,0],[2,2,2],[3,0],[3,2,2],[4,0],[4,3,3],[5,0],[5,3,3]])}</div><p class='mu'>Open circles are open strings. Dots show the fret and the finger to use.</p></div>`;
h+=`<h2>How to play it</h2><div class='card'><p><b>Notes:</b> E G | A B | D E | G A | B D | E G</p><p><b>1.</b> On each string, play the open string, then the fretted note: fret 3 on the low E, fret 2 on A, D and G, and fret 3 on B and high e.</p><p><b>2.</b> Use your middle finger for fret 2 and your ring finger for fret 3.</p><p><b>3.</b> Start on the low E and go up to the high e, then come back down.</p><p><b>4.</b> Use alternate picking (down, up) and the metronome at 60 BPM, one note per click. Make every note ring clearly.</p></div>`;
h+=`<h2>Once it feels easy</h2><div class='card'><p>Play it backward, starting from the high e.</p><p>Play only the first three notes on each string, then try other small groups.</p><p>Make a mini riff: E, G, A, then back down G, E. Repeat it with a strumming rhythm.</p></div>`;
h+=`<h2>Metronome</h2>`+met();
return h}
var ACC=[{n:`Blue`,l:`#2563eb`,d:`#6ea1ff`},{n:`Indigo`,l:`#4f46e5`,d:`#9a95ff`},{n:`Purple`,l:`#9333ea`,d:`#c58bff`},{n:`Pink`,l:`#db2777`,d:`#ff7ab6`},{n:`Red`,l:`#dc2626`,d:`#ff7a73`},{n:`Orange`,l:`#ea580c`,d:`#ffa05a`},{n:`Green`,l:`#16a34a`,d:`#4ade80`},{n:`Teal`,l:`#0d9488`,d:`#2dd4bf`}];
var mode=sg(`gp_mode`)||`system`;if(mode!==`light`&&mode!==`dark`)mode=`system`;
var acc=parseInt(sg(`gp_acc`)||`0`,10);if(!(acc>=0&&acc<ACC.length))acc=0;
var mq=window.matchMedia(`(prefers-color-scheme: dark)`);
function isDark(){return mode===`dark`||(mode===`system`&&mq.matches)}
function applyAcc(){var a=ACC[acc],d=isDark(),r=document.documentElement;r.setAttribute(`data-mode`,d?`dark`:`light`);r.style.setProperty(`--ac`,d?a.d:a.l);r.style.setProperty(`--on`,d?`#0e0e10`:`#fff`)}
function swHTML(){var ms=[[`system`,`Auto`],[`light`,`Light`],[`dark`,`Dark`]];return `<div class='md'>`+ms.map(function(m){return `<button data-m='${m[0]}' aria-pressed='${mode===m[0]}'>${m[1]}</button>`}).join(``)+`</div><div class='sw'>`+ACC.map(function(a,i){return `<button data-a='${i}' aria-label='${a.n} accent color' aria-pressed='${i===acc}' style='background:${isDark()?a.d:a.l}'></button>`}).join(``)+`</div>`}
function menu(o){var n=$(`#nav`),b=$(`#mbtn`);if(o===undefined)o=!n.classList.contains(`open`);n.classList.toggle(`open`,o);b.classList.toggle(`open`,o);b.setAttribute(`aria-expanded`,o?`true`:`false`)}
try{mq.addEventListener(`change`,function(){applyAcc();render()})}catch(e){}
applyAcc();
var VIEWS={today:["Today",today_],warm:["Warm-up",warm_],chords:["Chords",chords_],strum:["Strum",strum_],scale:["Scale",scale_],songs:["Songs",songs_],nums:["Numbers",nash_],plan:["Plan",plan_],learn:["Learn",learn_]};
function render(){Object.keys(ANIM).forEach(anStop);
$("#nav").innerHTML=Object.keys(VIEWS).map(function(k){return '<button aria-current="'+(k===tab?"page":"false")+'" data-t="'+k+'">'+VIEWS[k][0]+'</button>'}).join("")+swHTML();
$("#app").innerHTML=VIEWS[tab][1]();
document.querySelectorAll("details[data-an][open]").forEach(anOpen);
if($("#br")){var r=$("#br");r.oninput=function(){setBpm(r.value)};$("#mb").onclick=toggleMet;if(tmr){$("#mb").textContent="Stop";$("#mb").setAttribute("aria-pressed","true")}
if($("#dn"))$("#dn").onclick=function(){if(days.indexOf(today())<0){days.push(today());ss("gp_days",JSON.stringify(days))}render()}}
}
document.addEventListener("click",function(e){
if(e.target.closest("#mbtn")){menu();return}
var ac=e.target.closest("[data-a]");if(ac){acc=parseInt(ac.getAttribute("data-a"),10);ss("gp_acc",acc);applyAcc();render();return}
var md=e.target.closest("[data-m]");if(md){mode=md.getAttribute("data-m");ss("gp_mode",mode);applyAcc();render();return}
var qa=e.target.closest("[data-q]");if(qa){if(Q.pick===null){Q.pick=parseInt(qa.getAttribute("data-q"),10);qn++;if(Q.o[Q.pick]===Q.ans)qc++}$("#qz").innerHTML=quizHTML();return}
if(e.target.closest("[data-nq]")){newQ();$("#qz").innerHTML=quizHTML();return}
var kk=e.target.closest("[data-k]");if(kk){nk=kk.getAttribute("data-k");render();return}
if(!e.target.closest("#nav"))menu(false);
var t=e.target.closest("[data-t]");if(t){if(tmr){clearInterval(tmr);tmr=null}tab=t.getAttribute("data-t");menu(false);render();window.scrollTo(0,0);return}
var hd=e.target.closest("[data-h]");if(hd){lefty=hd.getAttribute("data-h")==="l";ss("gp_left",lefty?"1":"0");render();return}
var ap=e.target.closest("[data-ap]");if(ap){var aid=ap.getAttribute("data-ap"),ast=ANIM[aid];if(ast&&ast.t){anStop(aid);ast.paused=true}else{if(ast)ast.paused=false;anStart(aid)}return}
var dd=e.target.closest("[data-d]");if(dd){dayI=parseInt(dd.getAttribute("data-d"),10);render();return}
var w=e.target.closest("[data-w]");if(w){week=parseInt(w.getAttribute("data-w"),10);ss("gp_week",week);render()}});
document.addEventListener("change",function(e){var s=e.target.getAttribute("data-s");if(s===null)return;s=parseInt(s,10);
var i=chk.indexOf(s);if(e.target.checked&&i<0)chk.push(s);if(!e.target.checked&&i>-1)chk.splice(i,1);saveChk()});
document.addEventListener("toggle",function(e){var d=e.target,id;if(!d||d.tagName!=="DETAILS")return;id=d.getAttribute("data-an");if(!id)return;if(d.open)anOpen(d);else anStop(id)},true);
document.addEventListener("keydown",function(e){if(e.key==="Escape")menu(false)});
render();
var cref=null,cst=null;
function cloudSave(){if(!cref)return;clearTimeout(cst);cst=setTimeout(function(){try{cref.set({week:week,lefty:lefty,mode:mode,acc:acc,days:days,chk:chk,chkd:today(),t:Date.now()}).catch(function(){})}catch(e){}},500)}
(async function(){try{if(!window.claude||!claude.use)return;var us=await claude.use(`user`),db=await claude.use(`db`);if(!us||!db)return;var id=await us.id();if(!id)return;cref=db.collection(`data/users/${id}`).doc(`progress`);var s=await cref.get();if(!s.exists){cloudSave();return}var d=s.data()||{};if(d.week>=0&&d.week<4)week=d.week;if(typeof d.lefty===`boolean`)lefty=d.lefty;if(d.mode===`light`||d.mode===`dark`||d.mode===`system`)mode=d.mode;if(d.acc>=0&&d.acc<ACC.length)acc=d.acc;(d.days||[]).forEach(function(x){if(days.indexOf(x)<0)days.push(x)});if(d.chkd===today())chk=(d.chk||[]).slice();applyAcc();render();cloudSave()}catch(e){}})();
</script>
