<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Guitar">

<title>Guitar Practice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--f:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--bg:#f4f4f5;--card:#fff;--tx:#111113;--mu:#6b6b72;--bd:#e2e2e5;--pri:#111113;--onp:#fff;--ac:#2563eb;--on:#fff;color-scheme:light}
:root[data-mode="dark"]{--bg:#0f0f11;--card:#1a1a1e;--tx:#f4f4f5;--mu:#a1a1aa;--bd:#2a2a30;--pri:#f4f4f5;--onp:#111113;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 var(--f);-webkit-tap-highlight-color:transparent}
main{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 110px)}
body.full main{padding-bottom:40px}
h1{font:700 28px/1.15 var(--f);margin:8px 0 4px;letter-spacing:-.01em}
h2{font:600 20px/1.2 var(--f);margin:22px 0 8px}
p{margin:6px 0}
.mu{color:var(--mu);font-size:14px}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px);background:var(--bg);border-top:1px solid var(--bd)}
@supports (backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){#tabs{background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}}
#tabs button{background:none;border:0;color:var(--mu);font:600 11px var(--f);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;cursor:pointer}
#tabs button[aria-current=page]{color:var(--ac)}
body.full #tabs{display:none}
.song{border:1px solid var(--bd);border-radius:10px;background:var(--card);margin:10px 0;padding:0}
.song>summary{padding:14px;font:600 19px var(--f);list-style:none;display:flex;justify-content:space-between;align-items:center}
.song>summary::-webkit-details-marker{display:none}
.song>summary::after{content:"+";color:var(--ac);font-size:24px}
.song[open]>summary::after{content:"−"}
.song .card{border:0;margin:0;padding:0 14px 14px}
.tn-note{font:700 64px/1 var(--f);margin:6px 0}
.tn-gauge{position:relative;height:40px;margin:14px 0 4px;border:1px solid var(--bd);border-radius:6px;background:var(--bg)}
.tn-zone{position:absolute;left:45%;width:10%;top:0;bottom:0;background:var(--ac);opacity:.25}
.tn-mid{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--mu)}
.tn-needle{position:absolute;top:3px;bottom:3px;width:8px;margin-left:-4px;border-radius:3px;background:var(--mu);left:50%;transition:left .1s linear}
.tn-lab{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-bottom:8px}
@media (prefers-reduced-motion:reduce){.tn-needle{transition:none}}
.an{max-width:170px;margin:6px auto;text-align:center}
.an svg{width:100%;height:auto;display:block}
.hh{transform-origin:50px 100px}
.hh.sh{animation:hsh .25s linear infinite}
.hh.rl{animation:hrl 1s ease-in-out infinite}
.hh.st{animation:hst 1s ease-in-out infinite}
.hh.fs .fg{transform-origin:50px 57px;animation:hfs 1s ease-in-out infinite}
@keyframes hsh{0%{transform:translateX(-4px)}50%{transform:translateX(4px)}100%{transform:translateX(-4px)}}
@keyframes hrl{0%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}100%{transform:rotate(-18deg)}}
@keyframes hst{0%{transform:rotate(0)}50%{transform:rotate(-32deg)}100%{transform:rotate(0)}}
@keyframes hfs{0%{transform:scaleY(1)}50%{transform:scaleY(.35)}100%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.hh,.hh .fg{animation:none!important}}


button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.ch{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 8px 8px;text-align:center}
.ch b{font:600 20px var(--f)}
.ch svg{width:100%;height:auto;display:block}
.seg{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.seg button,.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:10px 14px;font:600 15px var(--f);cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--onp);border-color:var(--pri)}
.btn.go{background:var(--pri);color:var(--onp);border-color:var(--pri)}
.row{display:flex;align-items:center;gap:12px}
.bpm{font:600 40px var(--f);min-width:80px}
input[type=range]{flex:1;accent-color:var(--ac)}
.pat{font:600 22px var(--f);letter-spacing:.04em}
a{color:var(--ac);font-weight:600}
details{border-bottom:1px solid var(--bd);padding:8px 0}
summary{cursor:pointer;font-weight:600}
.st{font:600 36px var(--f);color:var(--ac)}
.stats{display:flex;gap:24px}
.pt{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;text-align:center;margin:8px 0}
.pt .c{font-size:12px;color:var(--mu)}
.pt .a{font:600 24px var(--f);border:1px solid var(--bd);border-radius:6px;padding:2px 0;background:var(--bg)}
.pt .a.on{color:var(--ac);border-color:var(--ac)}
.pt .a.off{color:var(--mu);opacity:.45}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 12px}
.bar{border:1px solid var(--bd);border-radius:6px;padding:8px 2px;text-align:center;background:var(--bg)}
.bar b{font:600 22px var(--f);color:var(--ac);display:block}
.bar span{font-size:11px;color:var(--mu);display:block}
#app.enter>*{animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hello{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px}
.hello h1{font:800 30px/1.1 var(--f);letter-spacing:-.02em;margin:2px 0 0}
.hello p{margin:0}
.circ{width:44px;height:44px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);display:flex;align-items:center;justify-content:center;cursor:pointer;font:600 22px var(--f);padding:0;flex:none}
.card.hero{border-radius:20px;padding:18px}
.lab{font-size:12px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 4px}
.hero .lab{margin:0}
.sb{justify-content:space-between}
.pill{display:inline-flex;background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:3px}
.pill button{background:none;border:0;color:var(--mu);font:600 13px var(--f);white-space:nowrap;padding:7px 12px;border-radius:999px;min-height:36px;cursor:pointer}
.pill button[aria-pressed=true]{background:var(--ac);color:var(--on)}
.pill.wide{display:flex;margin:4px 0 8px}.pill.wide button{flex:1;padding:7px 4px}
.steps{margin-top:10px}
.stp{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--bd);animation:in .35s ease both}
.ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.stp b{display:block;font-size:15px;line-height:1.3}.stp small{display:block;font-size:13px;color:var(--mu);line-height:1.3;margin-top:2px}
.stp .m{margin-left:auto;font-size:13px;color:var(--mu);white-space:nowrap}
.tag{font:700 11px var(--f);padding:2px 8px;border-radius:999px;margin-left:6px;background:color-mix(in srgb,var(--ac) 20%,transparent);color:var(--ac);vertical-align:2px;white-space:nowrap}
.big.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;border:0;border-radius:14px;background:var(--ac);color:var(--on);font:700 17px var(--f);cursor:pointer;margin-top:12px}
.big.go:active{transform:scale(.98)}
.goal{display:flex;gap:14px;align-items:center;margin-top:10px}
.ring{width:64px;height:64px;position:relative;flex:none}.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font:600 12px var(--f);padding:4px 9px;border-radius:999px;background:var(--bg);color:var(--mu);border:1px solid var(--bd)}
.chip.s1,.chip.s2{color:var(--ac);border-color:var(--ac)}
.chip.s3,.chip.s4{background:var(--ac);color:var(--on);border-color:var(--ac)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0}
.dd{display:flex;flex-direction:column;align-items:center;gap:6px;font:600 12px var(--f);color:var(--mu)}
.dd i{width:32px;height:32px;border-radius:999px;background:var(--bd)}
.dd i.y{background:var(--ac)}.dd i.t{background:none;border:2px solid var(--ac)}
.refs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.refs button{background:var(--card);border:1px solid var(--bd);border-radius:14px;color:var(--tx);font:600 13px var(--f);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-height:72px}
.refs span{font-size:20px}
.list{padding:4px 14px}
.sk{border-bottom:1px solid var(--bd);padding:0}.sk:last-child{border:0}
.sk>summary{display:flex;align-items:center;gap:10px;padding:12px 0;list-style:none;font-weight:600}
.sk>summary::-webkit-details-marker{display:none}
.sk .nm{flex:1}.sk>summary .mu{font-weight:500;font-size:13px;white-space:nowrap}
.sk>div{padding:0 0 12px}
.dot{width:12px;height:12px;border-radius:999px;border:2px solid var(--mu);flex:none}
.dot.s1{border-color:var(--ac)}.dot.s2{border-color:#f59e0b}.dot.s3{background:var(--ac);border-color:var(--ac)}.dot.s4{background:#22c55e;border-color:#22c55e}
.back{background:none;border:0;color:var(--ac);font:600 16px var(--f);padding:8px 0;cursor:pointer;min-height:44px}
.sx{display:flex;align-items:center;justify-content:space-between}
.prog{display:flex;gap:4px;margin:12px 0 10px}.prog i{flex:1;height:4px;border-radius:2px;background:var(--bd)}.prog i.d{background:var(--ac)}.prog i.c{background:var(--ac);opacity:.5}
.tmr{position:relative;width:150px;height:150px;margin:8px auto 4px}
.tmr svg{width:100%;height:100%}.tmr circle{fill:none;stroke-width:8}.tr-bg{stroke:var(--bd)}.tr-fg{stroke:var(--ac);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.tmr button{position:absolute;inset:14px;border-radius:999px;border:0;background:none;color:var(--tx);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tmr b{font:800 32px var(--f)}.tmr span{font:600 13px var(--f);color:var(--mu)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 24px}
.rate button{background:var(--card);border:1px solid var(--bd);border-radius:14px;color:var(--tx);padding:12px 4px;font-size:24px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-height:84px}
.rate b{font:600 13px var(--f)}
.rate button.sug{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
.g1{grid-template-columns:minmax(0,170px);justify-content:center}.g2{grid-template-columns:repeat(2,minmax(0,160px));justify-content:center}
.inp{width:100%;font:16px var(--f);padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);margin:6px 0 4px}
.seg.col{flex-direction:column}.seg.col button{text-align:left;display:flex;flex-direction:column}.seg.col .mu{font-weight:400}
.seg.col button[aria-pressed=true] .mu{color:inherit;opacity:.8}
.recb{width:88px;height:88px;border-radius:999px;border:4px solid var(--bd);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;margin:8px auto}
.recb i{width:36px;height:36px;border-radius:999px;background:#ef4444;transition:all .2s}
.recb.on i{border-radius:8px;width:30px;height:30px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.done{text-align:center;padding:24px 0 8px}
.ok{width:84px;height:84px;margin:0 auto 8px;border-radius:999px;background:var(--ac);color:var(--on);display:flex;align-items:center;justify-content:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.rs{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.rs:last-child{border:0}
.up{color:var(--ac)}
.md{display:flex;gap:4px;padding:4px 0 10px}.md button{flex:1;text-align:center;padding:8px 4px;font:600 14px var(--f);border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);cursor:pointer;min-height:40px}
.md button[aria-pressed=true]{background:var(--pri);color:var(--onp);border-color:var(--pri)}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.sw button{height:34px;border-radius:8px;border:2px solid transparent;cursor:pointer}
.sw button[aria-pressed=true]{border-color:var(--tx);box-shadow:inset 0 0 0 2px var(--card)}

.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:10px}
.emo button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;padding:2px 0;font-size:17px;min-height:44px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.emo button[aria-pressed=true]{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 18%,transparent)}
.emo b{font:700 12px var(--f)}
.emo b{font-size:11px}.emo .del{grid-column:1/-1;justify-self:end;padding:0 12px;min-height:36px;font:600 13px var(--f);color:var(--mu)}
@media (prefers-reduced-motion:reduce){#app.enter>*,.stp,.ok,.recb.on i{animation:none}.tr-fg{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="tabs" aria-label="Main"></nav>
<script>
var CH={
Em:{f:[0,2,2,0,0,0],n:[0,2,3,0,0,0]},
Am:{f:[-1,0,2,2,1,0],n:[0,0,2,3,1,0]},
E:{f:[0,2,2,1,0,0],n:[0,2,3,1,0,0]},
A:{f:[-1,0,2,2,2,0],n:[0,0,1,2,3,0]},
D:{f:[-1,-1,0,2,3,2],n:[0,0,0,1,3,2]},
G:{f:[3,2,0,0,0,3],n:[2,1,0,0,0,3]},
C:{f:[-1,3,2,0,1,0],n:[0,3,2,0,1,0]},
Dm:{f:[-1,-1,0,2,3,1],n:[0,0,0,2,3,1]},
A7:{f:[-1,0,2,0,2,0],n:[0,0,2,0,3,0]},
D7:{f:[-1,-1,0,2,1,2],n:[0,0,0,2,1,3]},
E7:{f:[0,2,0,1,0,0],n:[0,2,0,1,0,0]},
Asus2:{f:[-1,0,2,2,0,0],n:[0,0,1,2,0,0]},
G7:{f:[3,2,0,0,0,1],n:[3,2,0,0,0,1]},
Cmaj7:{f:[-1,3,2,0,0,0],n:[0,3,2,0,0,0]},
Fmaj7:{f:[-1,-1,3,2,1,0],n:[0,0,3,2,1,0]},
"F easy":{f:[-1,-1,3,2,1,1],n:[0,0,3,2,1,1],b:[1,4,5]},
F:{f:[1,3,3,2,1,1],n:[1,3,4,2,1,1],b:[1,0,5]},
Bm:{f:[-1,2,4,4,3,2],n:[0,1,3,4,2,1],b:[2,1,5]},
Em7:{f:[0,2,2,0,3,0],n:[0,1,2,0,3,0]},
Cadd9:{f:[-1,3,2,0,3,0],n:[0,2,1,0,3,0]},
Dsus2:{f:[-1,-1,0,2,3,0],n:[0,0,0,1,3,0]},
Dsus4:{f:[-1,-1,0,2,3,3],n:[0,0,0,1,2,3]},
B7:{f:[-1,2,1,2,0,2],n:[0,2,1,3,0,4]},
E5:{f:[0,2,2,-1,-1,-1],n:[0,1,2,0,0,0]}
};
var $=function(s){return document.querySelector(s)};
function sg(k){try{return localStorage.getItem(k)}catch(e){return null}}
function ss(k,v){try{localStorage.setItem(k,v)}catch(e){}cloudSave()}
function today(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
var tab="home";
var lefty=sg("gp_left")==="1";
function hand(){return '<div class="seg" role="group" aria-label="Handedness"><button aria-pressed="'+!lefty+'" data-h="r">Right-handed</button><button aria-pressed="'+lefty+'" data-h="l">Left-handed</button></div>'}
var days=[];try{days=JSON.parse(sg("gp_days")||"[]")}catch(e){days=[]}
function dia(name){
var c=CH[name],s='<svg viewBox="0 0 100 126" role="img" aria-label="'+name+' chord diagram">';
var x0=15,dx=14,top=32,fh=17,i,f;
for(i=0;i<6;i++){s+='<line x1="'+(x0+i*dx)+'" y1="'+top+'" x2="'+(x0+i*dx)+'" y2="'+(top+5*fh)+'" stroke="var(--mu)" stroke-width="1"/>'}
for(i=0;i<=5;i++){s+='<line x1="'+x0+'" y1="'+(top+i*fh)+'" x2="'+(x0+5*dx)+'" y2="'+(top+i*fh)+'" stroke="'+(i?'var(--mu)':'var(--tx)')+'" stroke-width="'+(i?1:3.5)+'"/>'}
if(c.b){var bx1=x0+(lefty?5-c.b[2]:c.b[1])*dx,bx2=x0+(lefty?5-c.b[1]:c.b[2])*dx,by=top+(c.b[0]-.5)*fh;s+='<rect x="'+(bx1-6.5)+'" y="'+(by-6.5)+'" width="'+(bx2-bx1+13)+'" height="13" rx="6.5" fill="var(--ac)"/><text x="'+bx1+'" y="'+(by+3.5)+'" text-anchor="middle" font-size="10" font-weight="700" fill="var(--on)">1</text>'}
for(i=0;i<6;i++){f=c.f[i];var x=x0+(lefty?5-i:i)*dx;
if(f<0)s+='<text x="'+x+'" y="23" text-anchor="middle" font-size="14" fill="var(--mu)">×</text>';
else if(f===0)s+='<circle cx="'+x+'" cy="19" r="4" fill="none" stroke="var(--mu)" stroke-width="1.5"/>';
else if(c.b&&f===c.b[0]&&c.n[i]===1){}
else{var y=top+(f-.5)*fh;s+='<circle cx="'+x+'" cy="'+y+'" r="6.5" fill="var(--ac)"/><text x="'+x+'" y="'+(y+4)+'" text-anchor="middle" font-size="10" font-weight="700" fill="var(--on)">'+c.n[i]+'</text>'}}
s+='<text x="50" y="122" text-anchor="middle" font-size="8" fill="var(--mu)">'+(lefty?"e B G D A E":"E A D G B e")+'</text></svg>';
return s}
function chordCard(n){return '<div class="ch"><b>'+n+'</b>'+dia(n)+'</div>'}
function streak(ds){var set={},n=0,d=new Date();(ds||days).forEach(function(x){set[x]=1});
function key(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
if(!set[key(d)])d.setDate(d.getDate()-1);
while(set[key(d)]||d.getDay()===0){if(set[key(d)])n++;d.setDate(d.getDate()-1)}return n}
var ctx=null,tmr=null,bpm=65,beat=0,nextT=0;
function clickAt(t,acc){try{var o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=acc?1200:800;g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.06);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.07)}catch(e){}}
function sched(){while(nextT<ctx.currentTime+.15){clickAt(nextT,beat%4===0);beat++;nextT+=60/bpm}}
function metStop(){if(tmr){clearInterval(tmr);tmr=null}var b=$("#mb");if(b){b.textContent="Start";b.setAttribute("aria-pressed","false")}}
function toggleMet(){if(tmr){metStop();return}try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.resume)ctx.resume()}catch(e){return}beat=0;nextT=ctx.currentTime+.05;sched();tmr=setInterval(sched,25);$("#mb").textContent="Stop";$("#mb").setAttribute("aria-pressed","true")}

h+=`<details class='song' data-an='spider' open><summary>Spider walk (2 min)</summary><div class='card'><p>The spider walk trains each finger to land on its own fret. Watch where each finger goes, then copy it on your guitar. The animation takes one step per second, which matches the metronome at 60 BPM.</p>${anBox('spider')}<p><b>1.</b> Put your index finger (1) on fret 1 of the thickest string, just behind the fret. Pick the note.</p><p><b>2.</b> Add your middle finger (2) on fret 2, ring (3) on fret 3, and pinky (4) on fret 4. Pick each note as you go.</p><p><b>3.</b> Move to the next string and repeat. Work across all six strings, then come back.</p><p><b>4.</b> Use the metronome at 60 BPM, one note per click, and make every note ring clearly.</p><p><b>Tips.</b> Keep your thumb behind the neck and your fingers arched. Keep fingertips close to the strings between notes instead of flying up. Press only as hard as you need. A weak pinky is normal and gets stronger.</p><p><b>Variations.</b> 1-3-2-4, 1-2-4-3, and 4-3-2-1 (pinky first). After a week or two, start the pattern at fret 2, then fret 3. Higher up the neck the frets are closer together, so the stretch is easier.</p></div></details>`;
